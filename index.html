<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ahmed & Aya</title>
    <meta name="description" content="Ahmed & Aya · Our Journey">
    <meta name="theme-color" content="#FBF7F1">

    <!-- Link preview (WhatsApp, iMessage, etc.) -->
    <meta property="og:title" content="Ahmed & Aya">
    <meta property="og:description" content="Our Journey">
    <meta property="og:image" content="https://raw.githubusercontent.com/RemyTCHB/Yoyo/main/hero.jpg">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="favicon-64.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ivory: #FBF7F1;
            --paper: #FFFDF9;
            --blush: #F4E6E1;
            --blush-deep: #E8CFC7;
            --ink: #2F2722;
            --ink-soft: #5E534C;
            --muted: #8F837A;
            --gold: #B08D57;
            --gold-light: #D9C6A1;
            --gold-pale: #EFE4CF;
            --gold-deep: #85622F;
            --rose: #9E4A5A;
            --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 12px 32px -12px rgba(60, 40, 20, .18);

            --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            --script: "Pinyon Script", "Snell Roundhand", cursive;
            --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(244, 230, 225, .9), transparent 70%),
                radial-gradient(900px 500px at 100% 40%, rgba(239, 228, 207, .55), transparent 70%),
                radial-gradient(900px 500px at 0% 80%, rgba(244, 230, 225, .6), transparent 70%),
                var(--ivory);
            color: var(--ink);
            font-family: var(--serif);
            font-size: 18px;
            line-height: 1.55;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img, video { display: block; max-width: 100%; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

        .eyebrow {
            font-family: var(--sans);
            font-weight: 400;
            font-size: 11px;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: var(--gold-deep);
        }

        /* ---------- Floating motifs ---------- */
        #motifs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .motif {
            position: absolute;
            bottom: -60px;
            color: var(--gold);
            opacity: 0;
            animation: drift linear forwards;
            will-change: transform, opacity;
        }
        .motif svg { width: 100%; height: 100%; display: block; animation: sway 6s ease-in-out infinite alternate; }
        @keyframes drift {
            0%   { transform: translateY(0); opacity: 0; }
            12%  { opacity: var(--o, .38); }
            85%  { opacity: var(--o, .38); }
            100% { transform: translateY(calc(-100vh - 120px)); opacity: 0; }
        }
        @keyframes sway {
            from { transform: translateX(-14px) rotate(-8deg); }
            to   { transform: translateX(14px) rotate(8deg); }
        }

        /* Gold dust cursor trail (desktop only) */
        .dust {
            position: absolute; pointer-events: none; z-index: 90;
            width: 5px; height: 5px; border-radius: 50%;
            background: radial-gradient(circle, #fff6dc 0%, #d9b46a 55%, transparent 70%);
            animation: dust .9s ease-out forwards;
        }
        @keyframes dust { to { transform: translate(var(--dx), 24px) scale(.2); opacity: 0; } }

        /* ---------- Layout ---------- */
        .page { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }

        /* ---------- Hero ---------- */
        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            align-items: center;
            text-align: center;
            padding: 28px 0 8px;
        }
        @media (min-width: 860px) {
            .hero { grid-template-columns: 0.9fr 1.1fr; gap: 64px; padding-top: 48px; }
            .arch { width: min(78vw, 360px); }
        }
        @media (max-width: 859px) {
            .hero { gap: 22px; padding-top: 8px; }
            .countdown-card { margin-top: 28px; }
        }

        .arch {
            position: relative;
            width: min(56vw, 360px);
            margin: 0 auto;
            aspect-ratio: 4 / 5;
            border-radius: 50% 50% 6px 6px / 40% 40% 6px 6px;
            overflow: hidden;
            box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--gold-light), var(--shadow);
            background: var(--blush);
        }
        .arch img { width: 100%; height: 100%; object-fit: cover; }

        .hero-text .eyebrow { display: block; margin-bottom: 18px; }
        .names {
            font-family: var(--script);
            font-weight: 400;
            font-size: clamp(64px, 15vw, 128px);
            line-height: .95;
            margin: 0;
            color: var(--gold-deep);
            background: linear-gradient(100deg, #7A5626 0%, #B48A4A 35%, #8A6531 60%, #B99357 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 .1em .08em;
        }
        .names .amp { display: block; font-size: .55em; line-height: 1.1; }
        .tagline {
            font-style: italic;
            font-size: clamp(20px, 3.6vw, 26px);
            color: var(--ink-soft);
            margin: 14px 0 0;
        }

        .ornament {
            display: flex; align-items: center; justify-content: center; gap: 14px;
            color: var(--gold); margin: 22px auto;
        }
        .ornament::before, .ornament::after {
            content: ""; height: 1px; width: min(90px, 18vw);
            background: linear-gradient(90deg, transparent, var(--gold-light));
        }
        .ornament::after { transform: scaleX(-1); }
        .ornament svg { width: 22px; height: 22px; }

        .date-line {
            font-family: var(--sans);
            font-weight: 400;
            letter-spacing: .28em;
            text-transform: uppercase;
            font-size: 13px;
            color: var(--ink);
        }
        .date-line b { font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: .04em; margin: 0 .25em; vertical-align: -3px; }
        .time-line { font-style: italic; color: var(--muted); margin-top: 6px; font-size: 18px; }

        /* ---------- Countdown ---------- */
        .countdown-card {
            margin: 40px auto 0;
            max-width: 760px;
            background: rgba(255, 253, 249, .78);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold-pale);
            border-radius: 4px;
            padding: 30px 18px 26px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
        }
        .countdown-card::before {
            content: ""; position: absolute; inset: 7px;
            border: 1px solid var(--gold-pale); border-radius: 2px; pointer-events: none;
        }
        .countdown { display: flex; justify-content: center; align-items: flex-start; gap: 4px; margin-top: 14px; }
        .unit { min-width: 64px; flex: 0 1 120px; }
        .unit .num {
            display: block;
            font-family: var(--serif);
            font-weight: 500;
            font-size: clamp(44px, 11vw, 76px);
            line-height: 1;
            color: var(--ink);
            font-variant-numeric: lining-nums tabular-nums;
        }
        .unit .lbl { display: block; margin-top: 8px; }
        .sep { font-family: var(--serif); font-size: clamp(32px, 8vw, 54px); color: var(--gold-light); line-height: 1.1; }

        .progress { margin: 26px auto 0; max-width: 460px; }
        .progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; color: var(--ink-soft); }
        .progress-row em { color: var(--gold-deep); font-style: italic; }
        .bar { height: 2px; background: var(--gold-pale); margin-top: 8px; position: relative; overflow: hidden; }
        .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--gold-light), var(--gold)); transition: width 1.2s ease; }
        .next-unlock { margin-top: 14px; font-style: italic; color: var(--muted); font-size: 17px; }
        .next-unlock strong { font-style: normal; font-weight: 500; color: var(--ink); }

        .big-day { display: none; padding: 6px 0 4px; }
        .big-day h2 {
            font-family: var(--script); font-weight: 400; margin: 0;
            font-size: clamp(44px, 11vw, 80px); line-height: 1.1; color: var(--rose);
        }
        .big-day p { margin: 6px 0 0; font-style: italic; color: var(--ink-soft); font-size: 20px; }
        .is-big-day .countdown, .is-big-day .countdown-eyebrow, .is-big-day .next-unlock { display: none; }
        .is-big-day .big-day { display: block; }

        /* ---------- Journey ---------- */
        .section-head { text-align: center; margin: 40px 0 36px; }
        .section-head h2 {
            font-family: var(--script); font-weight: 400; margin: 6px 0 0;
            font-size: clamp(52px, 11vw, 80px); line-height: 1; color: var(--gold-deep);
        }
        .section-head p { margin: 10px auto 0; font-style: italic; color: var(--ink-soft); font-size: 20px; max-width: 520px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px 28px;
            max-width: 380px;
            margin: 0 auto;
        }
        @media (min-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); max-width: 760px; } }
        @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); max-width: none; } }

        .card {
            position: relative;
            display: block;
            width: 100%;
            text-align: center;
            background: var(--paper);
            border: 1px solid var(--gold-pale);
            border-radius: 4px;
            padding: 22px 22px 24px;
            box-shadow: var(--shadow);
            transition: transform .45s cubic-bezier(.2, .7, .2, 1), box-shadow .45s ease;
            opacity: 0;
            transform: translateY(18px);
        }
        .card.in { opacity: 1; transform: none; transition: opacity .8s ease, transform .8s cubic-bezier(.2, .7, .2, 1), box-shadow .45s ease; }
        .card.in:hover { transform: translateY(-6px); box-shadow: 0 1px 2px rgba(60,40,20,.05), 0 24px 44px -16px rgba(60,40,20,.28); }
        .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

        .card .no { display: block; margin-bottom: 16px; }
        .card .frame {
            position: relative;
            aspect-ratio: 4 / 5;
            border-radius: 50% 50% 4px 4px / 40% 40% 4px 4px;
            overflow: hidden;
            background: var(--blush);
            box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--gold-light);
            margin: 6px 6px 0;
        }
        .card .frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
        .card.in:hover .frame img { transform: scale(1.04); }
        .card .date { display: block; margin-top: 22px; }
        .card h3 {
            margin: 6px 0 0;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            font-size: 26px;
            line-height: 1.2;
            color: var(--ink);
        }

        .play-badge {
            position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(255, 253, 249, .88);
            box-shadow: 0 0 0 1px var(--gold-light), 0 8px 24px rgba(0, 0, 0, .2);
            display: grid; place-items: center; color: var(--gold-deep);
        }
        .play-badge svg { width: 22px; height: 22px; margin-left: 3px; }

        .new-badge {
            position: absolute; top: 14px; right: 14px; z-index: 2;
            font-family: var(--sans); font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
            color: var(--paper); background: var(--rose);
            padding: 5px 9px 5px 11px; border-radius: 999px;
            box-shadow: 0 4px 12px rgba(158, 74, 90, .35);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse { 50% { transform: scale(1.08); } }

        /* Locked */
        .card.locked .frame { background: var(--gold-pale); }
        .card.locked .frame img { filter: blur(16px) saturate(.6); transform: scale(1.25); }
        .card.locked .frame::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,253,249,.35), rgba(251,247,241,.7));
        }
        .lock {
            position: absolute; inset: 0; z-index: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            padding-top: 12%;
        }
        .lock .seal {
            width: 64px; height: 64px; border-radius: 50%;
            display: grid; place-items: center;
            background: var(--paper);
            box-shadow: 0 0 0 1px var(--gold-light), 0 0 0 6px rgba(255,253,249,.6), 0 10px 24px -8px rgba(60,40,20,.3);
            color: var(--gold-deep);
        }
        .lock .seal svg { width: 26px; height: 26px; }
        .lock .when { font-style: italic; font-size: 20px; color: var(--ink); line-height: 1.2; }
        .lock .when small { display: block; font-family: var(--sans); font-style: normal; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 4px; }
        .card.locked h3 { color: var(--muted); }

        /* ---------- Footer ---------- */
        footer { text-align: center; margin-top: 96px; color: var(--muted); }
        .monogram {
            width: 92px; height: 92px; margin: 0 auto 14px; border-radius: 50%;
            display: grid; place-items: center;
            box-shadow: 0 0 0 1px var(--gold-light), 0 0 0 5px var(--ivory), 0 0 0 6px var(--gold-pale);
            font-family: var(--script); font-size: 40px; color: var(--gold-deep);
        }

        /* ---------- Viewer ---------- */
        .viewer {
            position: fixed; inset: 0; z-index: 100;
            background: #1A1512;
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
            opacity: 0; transition: opacity .35s ease;
        }
        .viewer.open { display: flex; }
        .viewer.show { opacity: 1; }
        .viewer-inner {
            width: 100%; max-width: 980px; max-height: 100%;
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(12px) scale(.98); transition: transform .45s cubic-bezier(.2, .7, .2, 1);
        }
        .viewer.show .viewer-inner { transform: none; }
        .media {
            position: relative; display: flex; align-items: center; justify-content: center;
            max-height: 62vh; width: 100%;
            touch-action: pan-y;
        }
        .media img, .media video {
            max-height: 62vh; max-width: 100%; width: auto; height: auto;
            border-radius: 3px;
            box-shadow: 0 0 0 1px rgba(217, 198, 161, .35), 0 30px 60px -20px rgba(0, 0, 0, .7);
            background: #111;
        }
        .media.slide-l > * { animation: inL .4s cubic-bezier(.2,.7,.2,1); }
        .media.slide-r > * { animation: inR .4s cubic-bezier(.2,.7,.2,1); }
        @keyframes inL { from { opacity: 0; transform: translateX(40px); } }
        @keyframes inR { from { opacity: 0; transform: translateX(-40px); } }

        .caption { text-align: center; color: #F3ECE2; max-width: 620px; width: 100%; margin-top: 22px; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
        .media { flex-shrink: 0; }
        .caption .eyebrow { color: var(--gold-light); }
        .caption h3 { font-family: var(--script); font-weight: 400; font-size: clamp(38px, 8vw, 54px); line-height: 1.1; margin: 6px 0 4px; color: #E7D3AC; }
        .caption p { font-size: 19px; line-height: 1.6; color: #E6DED3; margin: 0; }

        /* Arabic (right-to-left) memories */
        .ar { font-family: "Amiri", "Traditional Arabic", serif !important; font-style: normal !important; }
        .card h3.ar { font-size: 27px; line-height: 1.5; font-weight: 700; }
        .caption h3.ar { font-size: clamp(30px, 7vw, 42px); line-height: 1.6; font-weight: 700; margin: 4px 0 10px; }
        .caption p.ar { font-size: 21px; line-height: 2.05; white-space: pre-line; text-align: right; padding: 0 6px 28px; }
        .viewer.long .media, .viewer.long .media img, .viewer.long .media video { max-height: 40vh; }
        .viewer.long .caption {
            -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 36px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 36px), transparent 100%);
        }

        .v-btn {
            position: absolute; z-index: 2;
            width: 48px; height: 48px; border-radius: 50%;
            display: grid; place-items: center;
            color: #EFE4CF; background: rgba(255, 255, 255, .06);
            box-shadow: inset 0 0 0 1px rgba(217, 198, 161, .35);
            transition: background .2s ease, transform .2s ease;
        }
        .v-btn:hover { background: rgba(255, 255, 255, .14); }
        .v-btn svg { width: 20px; height: 20px; }
        .v-close { top: max(14px, env(safe-area-inset-top)); right: 14px; }
        .v-prev { left: 14px; top: 50%; transform: translateY(-50%); }
        .v-next { right: 14px; top: 50%; transform: translateY(-50%); }
        .v-count { position: absolute; top: max(28px, calc(env(safe-area-inset-top) + 14px)); left: 50%; transform: translateX(-50%); color: var(--gold-light); }
        @media (max-width: 700px) {
            .v-prev, .v-next { top: auto; bottom: max(14px, env(safe-area-inset-bottom)); transform: none; }
            .v-prev { left: calc(50% - 60px); }
            .v-next { right: calc(50% - 60px); }
            .viewer { padding-bottom: 80px; }
        }

        /* ---------- Dialog ---------- */
        .dialog-wrap {
            position: fixed; inset: 0; z-index: 110;
            display: grid; place-items: center; padding: 16px;
            background: rgba(24, 19, 16, .5);
            opacity: 0; transition: opacity .3s ease;
        }
        .dialog-wrap.show { opacity: 1; }
        .dialog {
            position: relative;
            width: 100%; max-width: 380px; text-align: center;
            background: var(--paper); border-radius: 4px;
            padding: 36px 28px 28px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .45);
            transform: scale(.94); transition: transform .35s cubic-bezier(.2, .7, .2, 1);
        }
        .dialog::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--gold-pale); pointer-events: none; }
        .dialog-wrap.show .dialog { transform: none; }
        .dialog h4 { font-family: var(--script); font-weight: 400; font-size: 46px; line-height: 1; margin: 0 0 10px; color: var(--rose); }
        .dialog p { margin: 0 0 24px; color: var(--ink-soft); font-size: 19px; }
        .btn {
            position: relative;
            font-family: var(--sans); font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
            color: var(--paper); background: var(--gold-deep);
            padding: 14px 28px; border-radius: 999px;
            transition: background .2s ease;
        }
        .btn:hover { background: #6E4F23; }
        .btn:disabled { opacity: .7; cursor: default; }
        .dialog .pw {
            display: block; width: 100%; margin: -6px 0 6px;
            font: inherit; font-size: 20px; text-align: center; letter-spacing: .12em;
            color: var(--ink); background: var(--ivory);
            border: 1px solid var(--gold-light); border-radius: 999px;
            padding: 12px 18px; outline: none;
        }
        .dialog .pw:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176, 141, 87, .18); }
        .dialog .pw-error { display: block; min-height: 24px; margin-bottom: 12px; font-style: italic; color: var(--rose); font-size: 17px; }
        .shake { animation: shake .4s ease; }
        @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

        /* ---------- Confetti ---------- */
        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 120; width: 100%; height: 100%; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
            #motifs { display: none; }
        }
    </style>
</head>
<body>

    <div id="motifs" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main class="page">

        <!-- ================= HERO ================= -->
        <section class="hero">
            <div class="arch">
                <img src="hero.jpg" data-asset="hero.jpg" alt="Bubbles and Batman in a field of flowers">
            </div>

            <div class="hero-text">
                <h1 class="names">Ahmed <span class="amp">&amp;</span> Aya</h1>

                <div class="ornament" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.1c0 5.1-7 9.4-7 9.4z"/></svg>
                </div>

            </div>
        </section>

        <!-- ================= JOURNEY ================= -->
        <header class="section-head">
            <span class="eyebrow">Chapter by chapter</span>
            <h2>Our Journey</h2>
            <p>Memories unlock one by one</p>
        </header>

        <section class="grid" id="grid"></section>

        <footer>
            <div class="monogram">A&amp;A</div>
            <span class="eyebrow">26 · 11 · 2026</span>
        </footer>
    </main>

    <!-- ================= VIEWER ================= -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Memory">
        <span class="eyebrow v-count" id="v-count"></span>
        <button class="v-btn v-close" id="v-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>

            '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="24" rx="20" ry="12.5"/><path d="M8.6 22.4c2.6 1.4 5 1.4 6.6.2-.6 2.4.4 4.6 2.4 5 .8-1.8 2.8-2.6 4.6-1.6l.8-3.4.6 1.2h.8l.6-1.2.8 3.4c1.8-1 3.8-.2 4.6 1.6 2-.4 3-2.6 2.4-5 1.6 1.2 4 1.2 6.6-.2-.8 4-4.4 7-9.4 7.6-1.6.2-3 1.2-4.4 3-1.4-1.8-2.8-2.8-4.4-3-5-.6-8.6-3.6-9.4-7.6z" fill="currentColor" fill-opacity=".18"/></svg>'
        ];

        // ============================================================================
        // GRID
        // ============================================================================
        const grid = $("grid");
        let unlockedSet = "";

        function isUnlocked(m, now) { return now >= m.unlockAt || now >= TARGET_DATE; }

        function renderGrid(now) {
            grid.innerHTML = "";
            memories.forEach((m, i) => {
                const open = isUnlocked(m, now);
                const card = document.createElement("button");
                card.type = "button";
                card.className = "card" + (open ? "" : " locked");
                card.style.transitionDelay = `${Math.min(i % 3, 2) * 90}ms`;

                const no = document.createElement("span");
                no.className = "eyebrow no";
                no.textContent = `No. ${m.num}`;

                const frame = document.createElement("div");
                frame.className = "frame";
                const img = document.createElement("img");
                img.loading = "lazy";
                img.decoding = "async";
                img.alt = open ? m.title : "A memory waiting to be unlocked";
                // Locked cards only get a tiny blurred preview, so the real photo can't be peeked at
                withFallback(img, open && !m.secret ? m.img : m.blur);
                frame.appendChild(img);

                const date = document.createElement("span");
                date.className = "eyebrow date";
                const h3 = document.createElement("h3");

                if (open && m.secret) {
                    // Unlocked by time, but the note itself needs the password
                    card.classList.add("locked");
                    const lock = document.createElement("div");
                    lock.className = "lock";
                    lock.innerHTML = `<span class="seal">${ICON.lock}</span><span class="when"><small>Password</small>Tap to open</span>`;
                    frame.appendChild(lock);
                    date.textContent = fancyDate(m.date);
                    h3.textContent = m.title;
                    if (m.rtl) { h3.dir = "rtl"; h3.lang = "ar"; h3.classList.add("ar"); }
                    card.setAttribute("aria-label", `Memory ${m.id} is protected by a password`);
                    card.addEventListener("click", () => askPassword(m));
                } else if (open) {
                    if (m.video) {
                        const pb = document.createElement("span");
                        pb.className = "play-badge";
                        pb.innerHTML = ICON.play;
                        frame.appendChild(pb);
                    }
                    if (!seen.includes(m.id)) {
                        const nb = document.createElement("span");
                        nb.className = "new-badge";
                        nb.textContent = "New";
                        card.appendChild(nb);
                    }
                    date.textContent = fancyDate(m.date);
                    h3.textContent = m.title;
                    if (m.rtl) { h3.dir = "rtl"; h3.lang = "ar"; h3.classList.add("ar"); }
                    card.setAttribute("aria-label", `Open memory ${m.id}: ${m.title}`);
                    card.addEventListener("click", () => openViewer(m.id));
                } else {
                    const { day, time } = unlockLabel(m.unlockAt);
                    const lock = document.createElement("div");
                    lock.className = "lock";
                    lock.innerHTML = `<span class="seal">${ICON.lock}</span><span class="when"><small>Unlocks</small></span>`;
                    lock.querySelector(".when").append(day);
                    frame.appendChild(lock);
                    date.textContent = "· · ·";
                    h3.textContent = "A memory awaits";
                    card.setAttribute("aria-label", `Locked memory, unlocks ${day}`);
                    card.addEventListener("click", () => {
                        const left = inWords(m.unlockAt - Date.now());
                        showDialog("Patience!", `This memory unlocks on ${day} at ${time} — just ${left} to go.`);
                    });
                }

                card.prepend(no);
                card.append(frame, date, h3);
                grid.appendChild(card);
            });
            observeCards();
        }

        let io;
        function observeCards() {
            const cards = grid.querySelectorAll(".card");
            if (!("IntersectionObserver" in window) || reduceMotion) { cards.forEach(c => c.classList.add("in")); return; }
            if (io) io.disconnect();
            io = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
            }, { rootMargin: "0px 0px -8% 0px" });
            cards.forEach(c => io.observe(c));
        }

        // ============================================================================
        // UNLOCK CHECK — re-render the grid whenever a memory opens
        // ============================================================================
        function tick() {
            const now = Date.now();
            const key = memories.map(m => isUnlocked(m, now) ? 1 : 0).join("");
            if (key !== unlockedSet) {
                const prev = unlockedSet;
                unlockedSet = key;
                renderGrid(now);
                if (prev && memories.some((m, i) => key[i] === "1" && prev[i] === "0" && !m.quiet)) burst();
            }
        }

        // ============================================================================
        // VIEWER (swipe, arrows, video)
        // ============================================================================
        const viewer = $("viewer"), media = $("v-media");
        let viewList = [], viewIndex = 0;

        function openViewer(id) {
            const now = Date.now();
            viewList = memories.filter(m => isUnlocked(m, now) && !m.secret);
            viewIndex = Math.max(0, viewList.findIndex(m => m.id === id));
            showMemory(0);
            viewer.classList.add("open");
            document.body.style.overflow = "hidden";
            requestAnimationFrame(() => requestAnimationFrame(() => viewer.classList.add("show")));
            $("v-close").focus({ preventScroll: true });
        }

        function closeViewer() {
            viewer.classList.remove("show");
            const v = media.querySelector("video");
            if (v) v.pause();
            setTimeout(() => {
                viewer.classList.remove("open");
                media.innerHTML = "";
                document.body.style.overflow = "";
            }, 350);
        }

        function showMemory(dir) {
            const m = viewList[viewIndex];
            const old = media.querySelector("video");
            if (old) old.pause();
            media.innerHTML = "";
            media.classList.remove("slide-l", "slide-r");
            void media.offsetWidth;
            if (dir > 0) media.classList.add("slide-l");
            if (dir < 0) media.classList.add("slide-r");

            if (m.video) {
                const v = document.createElement("video");
                v.controls = true;
                v.playsInline = true;
                v.autoplay = true;
                v.preload = "auto";
                v.poster = m.img;
                [m.video, FALLBACK_BASE + m.video].forEach(src => {
                    const s = document.createElement("source");
                    s.src = src; s.type = "video/mp4";
                    v.appendChild(s);
                });
                media.appendChild(v);
            } else {
                const img = document.createElement("img");
                img.alt = m.title;
                withFallback(img, m.img);
                media.appendChild(img);
            }

            $("v-count").textContent = `${viewIndex + 1} / ${viewList.length}`;
            $("v-date").textContent = `No. ${m.num} · ${fancyDate(m.date)}`;
            $("v-title").textContent = m.title;
            $("v-text").textContent = m.description;
            [$("v-title"), $("v-text")].forEach(el => {
                el.dir = m.rtl ? "rtl" : "auto";
                el.lang = m.rtl ? "ar" : "en";
                el.classList.toggle("ar", !!m.rtl);
            });
            viewer.classList.toggle("long", m.description.length > 280);
            document.querySelector(".caption").scrollTop = 0;
            $("v-prev").style.visibility = viewIndex > 0 ? "visible" : "hidden";
            $("v-next").style.visibility = viewIndex < viewList.length - 1 ? "visible" : "hidden";

            if (!seen.includes(m.id)) {
                markSeen(m.id);
                const badge = [...grid.querySelectorAll(".card")][m.id - 1]?.querySelector(".new-badge");
                if (badge) badge.remove();
            }
        }

        function step(dir) {
            const n = viewIndex + dir;
            if (n < 0 || n >= viewList.length) return;
            viewIndex = n;
            showMemory(dir);
        }

        $("v-close").onclick = closeViewer;
        $("v-prev").onclick = () => step(-1);
        $("v-next").onclick = () => step(1);
        viewer.addEventListener("click", e => {
            if (e.target === viewer || e.target.classList.contains("viewer-inner") || e.target === media) closeViewer();
        });
        document.addEventListener("keydown", e => {
            if (!viewer.classList.contains("open")) return;
            if (e.key === "Escape") closeViewer();
            if (e.key === "ArrowRight") step(1);
            if (e.key === "ArrowLeft") step(-1);
        });

        let touchX = null, touchY = null;
        let touchInCaption = false;
        viewer.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; touchInCaption = !!e.target.closest(".caption"); }, { passive: true });
        viewer.addEventListener("touchend", e => {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            const dy = e.changedTouches[0].clientY - touchY;
            touchX = null;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) step(dx < 0 ? 1 : -1);
            else if (!touchInCaption && dy > 110 && Math.abs(dy) > Math.abs(dx) * 1.5) closeViewer();
        }, { passive: true });

        // ============================================================================
        // DIALOG
        // ============================================================================
        // ============================================================================
        // PASSWORD-PROTECTED NOTE (decrypted in the browser, never stored in plain text)
        // ============================================================================
        const PW_KEY = "aa-note-pw";
        const fromB64 = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));

        async function unlockSecret(m, password) {
            const enc = new TextEncoder();
            const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: fromB64(m.secret.salt), iterations: 250000, hash: "SHA-256" },
                base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
            const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(m.secret.iv) }, key, fromB64(m.secret.data));
            const { description, img } = JSON.parse(new TextDecoder().decode(plain));
            m.description = description;
            m.img = img;
            delete m.secret;
            try { sessionStorage.setItem(PW_KEY, password); } catch (e) {}
        }

        function askPassword(m) {
            const wrap = document.createElement("div");
            wrap.className = "dialog-wrap";
            wrap.innerHTML = `<form class="dialog" role="alertdialog" aria-modal="true" autocomplete="off">
                <h4>Only us</h4>
                <p>This note opens with a password.</p>
                <input class="pw" type="password" aria-label="Password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
                <span class="pw-error" aria-live="polite"></span>
                <button class="btn" type="submit">Open</button>
            </form>`;
            document.body.appendChild(wrap);
            const form = wrap.querySelector("form"), input = wrap.querySelector("input"), err = wrap.querySelector(".pw-error"), btn = wrap.querySelector("button");
            requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("show")));
            setTimeout(() => input.focus(), 50);
            const close = () => { wrap.classList.remove("show"); setTimeout(() => wrap.remove(), 300); };
            wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
            form.addEventListener("submit", async e => {
                e.preventDefault();
                const pw = input.value.trim();
                if (!pw) return;
                btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
                try {
                    await unlockSecret(m, pw);
                    close();
                    renderGrid(Date.now());
                    setTimeout(() => openViewer(m.id), 320);
                } catch (x) {
                    err.textContent = "That's not it 🤍";
                    form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
                    input.select();
                } finally {
                    btn.disabled = false; btn.textContent = "Open";
                }
            });
        }

        function showDialog(title, message) {
            const wrap = document.createElement("div");
            wrap.className = "dialog-wrap";
            wrap.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><h4></h4><p></p><button class="btn" type="button">Okay</button></div>`;
            wrap.querySelector("h4").textContent = title;
            wrap.querySelector("p").textContent = message;
            document.body.appendChild(wrap);
            requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("show")));
            const close = () => { wrap.classList.remove("show"); setTimeout(() => wrap.remove(), 300); };
            wrap.querySelector("button").onclick = close;
            wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
            wrap.querySelector("button").focus({ preventScroll: true });
        }

        // ============================================================================
        // CONFETTI
        // ============================================================================
        const cv = $("confetti"), cx = cv.getContext("2d");
        let pieces = [], running = false;
        const COLORS = ["#D9C6A1", "#B08D57", "#E8CFC7", "#F4E6E1", "#FFFDF9", "#9E4A5A", "#EFD9A7"];

        function sizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
            cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        sizeCanvas();
        addEventListener("resize", sizeCanvas);

        function burst(count = 140, originY = 0.35) {
            if (reduceMotion) return;
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 8;
                pieces.push({
                    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * originY,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6,
                    w: 6 + Math.random() * 6, h: 8 + Math.random() * 10,
                    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
                    c: COLORS[i % COLORS.length], life: 0, round: Math.random() < .3
                });
            }
            if (!running) { running = true; requestAnimationFrame(frame); }
        }

        function rain(count = 60) {
            if (reduceMotion) return;
            for (let i = 0; i < count; i++) {
                pieces.push({
                    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5,
                    vx: (Math.random() - .5) * 1.5, vy: 2 + Math.random() * 2,
                    w: 6 + Math.random() * 6, h: 8 + Math.random() * 10,
                    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .2,
                    c: COLORS[i % COLORS.length], life: 0, round: Math.random() < .3
                });
            }
            if (!running) { running = true; requestAnimationFrame(frame); }
        }

        function frame() {
            cx.clearRect(0, 0, innerWidth, innerHeight);
            pieces = pieces.filter(p => p.y < innerHeight + 40 && p.life < 600);
            pieces.forEach(p => {
                p.life++;
                p.vx *= .985; p.vy = p.vy * .985 + .18;
                p.x += p.vx + Math.sin(p.life / 12) * .6; p.y += p.vy; p.r += p.vr;
                cx.save();
                cx.translate(p.x, p.y); cx.rotate(p.r);
                cx.fillStyle = p.c;
                if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, Math.PI * 2); cx.fill(); }
                else { cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life / 10))); }
                cx.restore();
            });
            if (pieces.length) requestAnimationFrame(frame);
            else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
        }

        // ============================================================================
        // FLOATING MOTIFS + GOLD DUST
        // ============================================================================
        const motifBox = $("motifs");
        function spawnMotif() {
            if (document.hidden || motifBox.childElementCount > 14) return;
            const el = document.createElement("div");
            el.className = "motif";
            el.innerHTML = MOTIFS[Math.floor(Math.random() * MOTIFS.length)];
            const size = 22 + Math.random() * 22;
            const dur = 16 + Math.random() * 14;
            el.style.width = el.style.height = `${size}px`;
            el.style.left = `${Math.random() * 100}vw`;
            el.style.setProperty("--o", (0.22 + Math.random() * 0.25).toFixed(2));
            el.style.animationDuration = `${dur}s`;
            el.firstChild.style.animationDelay = `${-Math.random() * 6}s`;
            motifBox.appendChild(el);
            setTimeout(() => el.remove(), dur * 1000);
        }

        if (window.matchMedia("(pointer: fine)").matches && !reduceMotion) {
            let last = 0;
            document.addEventListener("mousemove", e => {
                const t = performance.now();
                if (t - last < 40) return;
                last = t;
                const d = document.createElement("span");
                d.className = "dust";
                d.style.left = `${e.pageX - 2}px`;
                d.style.top = `${e.pageY - 2}px`;
                d.style.setProperty("--dx", `${(Math.random() - .5) * 20}px`);
                document.body.appendChild(d);
                setTimeout(() => d.remove(), 900);
            });
        }

        // ============================================================================
        // START
        // ============================================================================
        // Already entered the password in this browser session? Open it again quietly.
        (async () => {
            let pw = null;
            try { pw = sessionStorage.getItem(PW_KEY); } catch (e) {}
            const m = memories.find(x => x.secret);
            if (pw && m) { try { await unlockSecret(m, pw); unlockedSet = ""; } catch (e) {} }
            tick();
        })();
        setInterval(tick, 1000);

        // Celebrate newly unlocked memories she hasn't opened yet
        if (memories.some(m => isUnlocked(m, Date.now()) && !seen.includes(m.id) && !m.quiet)) {
            setTimeout(() => burst(120, .3), 900);
        }
        saveSeen();

        if (!reduceMotion) {
            for (let i = 0; i < 6; i++) setTimeout(spawnMotif, i * 400);
            setInterval(spawnMotif, 2200);
        }
    </script>
</body>
</html>
